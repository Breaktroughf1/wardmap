# Campaign-independent signals of CI credential theft.
id: generic
name: Generic CI credential-theft signals
version: 2026.11.26.2
indicators:
  - id: oidc-from-deleted-branch
    type: cloudtrail_deleted_branch
    confidence: high
    description: A cloud session was issued to a GitHub OIDC token from a branch that no longer exists (throwaway branch).
  - id: oidc-unknown-repo
    type: cloudtrail_unknown_repo
    confidence: medium
    description: A cloud session was issued to a repository outside the collected estate.
  - id: oidc-pull-request
    type: cloudtrail_pull_request
    confidence: medium
    description: A cloud session was issued to a pull_request token.
  - id: secrets-context-dump
    type: workflow_secrets_dump
    confidence: medium
    description: A workflow serialises the whole secrets or vars context (toJSON(secrets)), which stealers do and legitimate workflows rarely do.
  - id: trust-policy-change
    type: cloudtrail_event
    pattern: "UpdateAssumeRolePolicy"
    confidence: low
    description: A role trust policy was changed. Review each change made during a campaign window.
  - id: oidc-provider-change
    type: cloudtrail_event
    pattern: "*OpenIDConnectProvider*"
    confidence: medium
    description: The account's OIDC identity providers were created or modified.
