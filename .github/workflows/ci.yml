name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -coverpkg=./... -coverprofile=cover.out ./...
      - name: Coverage gate (75%)
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "coverage ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 75) }'
      - name: Fuzz (short)
        run: |
          go test -run '^$' -fuzz=FuzzParse -fuzztime=30s ./internal/workflow/
          go test -run '^$' -fuzz=FuzzOverlapSelf -fuzztime=30s ./internal/glob/
          go test -run '^$' -fuzz=FuzzAWSTrust -fuzztime=30s ./internal/oidc/
          go test -run '^$' -fuzz=FuzzGCPCondition -fuzztime=30s ./internal/oidc/
      - name: Demo estate
        run: |
          go run ./cmd/wardmap import -s examples/demo/snapshot.json -o "$RUNNER_TEMP/s.json" \
            --aws examples/demo/aws-roles.json \
            --azure examples/demo/fic-0b1c2d3e-4f50-6172-8394-a5b6c7d8e9f0.json \
            --gcp examples/demo/gcp-providers.json --cloudtrail examples/demo/cloudtrail.json \
            --azure-audit examples/demo/entra-audit.json
          go run ./cmd/wardmap scan -s "$RUNNER_TEMP/s.json" >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/wardmap hunt -s "$RUNNER_TEMP/s.json" >> "$GITHUB_STEP_SUMMARY"

  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # required by upload-sarif on private repositories
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          mode: offline
          fail-on: high
          # Code scanning is free on public repositories; private ones need
          # GitHub Code Security. Upload only where it is available.
          upload-sarif: ${{ github.event_name == 'push' && !github.event.repository.private && 'true' || 'false' }}

  packaging:
    # Builds the release archives without signing or publishing, and tests
    # the npm and PyPI launchers against them (checksum refusal included).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=sign
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Launcher tests
        env:
          WARDMAP_DIST: ${{ github.workspace }}/dist
        run: |
          node --test packaging/npm/test/install.test.js
          python -B -m unittest discover -s packaging/pypi/tests -v
      - name: Packages build
        run: |
          cd packaging/npm && npm pack --dry-run
